<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>i_singhhappy</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="nav">
    <a href="index.html" class="active"><svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></a>
    <a href="admin.html"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Files</span></a>
</nav>

<header>
    <img src="logo.png" alt="Happy Singh logo" class="logo" onerror="this.style.display='none'">
    <h1>HAPPY SINGH</h1>
    <p>HAPPY CONNECTING WITH YOU</p>
</header>

<main>

    <div class="admin-area">
        <h2>Admin Panel</h2>
        <button onclick="adminLogin()">Admin Login</button>
        <button onclick="adminLogout()">Logout</button>
    </div>

    <div class="admin-post">
        <h2>Create New Post</h2>
        <textarea id="postText" placeholder="Write your post..."></textarea>
        <input type="file" id="postFile">
        <input type="url" id="postLink" placeholder="Link (https://...)">
        <button id="publishBtn" onclick="createPost()">Publish Post</button>
    </div>

    <h2>Welcome to Happy Singh</h2>
    <p>Connect with everyone!</p>

    <div id="posts"></div>

</main>

<script type="module" src="script.js"></script>

</body>
</html>
