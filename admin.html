<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Files | i_singhhappy</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="nav">
    <a href="index.html"><svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></a>
    <a href="admin.html" class="active"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Files</span></a>
</nav>

<header>
    <img src="logo.png" alt="Happy Singh logo" class="logo" onerror="this.style.display='none'">
    <h1>FILES</h1>
    <p>PUBLIC AND ADMIN FILES</p>
</header>

<main>

    <div class="admin-area">
        <h2>Admin Panel</h2>
        <button id="loginBtn">Admin Login</button>
        <button id="logoutBtn" hidden>Logout</button>
    </div>

    <!-- Folder lists -->
    <div id="listBox">

        <!-- Section 1: Public -->
        <section class="files-section">
            <h2>🌍 Public Files</h2>
            <p class="sec-note">Ye files sabko dikhti hain.</p>

            <div class="admin-area admin-only" hidden>
                <input type="text" id="folderNamePublic" maxlength="40" placeholder="Public folder ka naam">
                <button id="createFolderPublic">📁 Public folder banao</button>
            </div>

            <div id="foldersPublic" class="folder-grid"></div>
        </section>

        <!-- Section 2: Admin -->
        <section class="files-section">
            <h2>🔒 Admin Files</h2>
            <p class="sec-note">Ye files sirf admin ko dikhti hain.</p>

            <div id="adminLock" class="admin-area lock">
                🔒 Ye section sirf admin ke liye hai. Admin Login karo.
            </div>

            <div id="adminBox" hidden>
                <div class="admin-area">
                    <input type="text" id="folderNameAdmin" maxlength="40" placeholder="Admin folder ka naam">
                    <button id="createFolderAdmin">📁 Admin folder banao</button>
                </div>
                <div id="foldersAdmin" class="folder-grid"></div>
            </div>
        </section>

    </div>

    <!-- Inside one folder -->
    <div id="folderBox" hidden>
        <div class="back-row">
            <button id="backBtn">← Wapas</button>
            <h2 id="folderTitle"></h2>
            <button id="deleteFolderBtn" class="danger admin-only" hidden>🗑 Folder delete</button>
        </div>

        <div class="admin-area admin-only" hidden>
            <h2>Files daalo</h2>
            <input type="file" id="fileInput" multiple>
            <button id="uploadBtn">⬆ Upload</button>
            <p id="status" class="status"></p>
        </div>

        <div id="files"></div>
    </div>

</main>

<script type="module" src="admin.js"></script>

</body>
</html>
